name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build unit tests and assemble debug APK
        run: gradle --no-daemon test assembleDebug

      - name: Compute version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "phonetics-${{ steps.ver.outputs.ver }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: phonetics-*.apk
          name: Phở-netics ${{ steps.ver.outputs.ver }}
